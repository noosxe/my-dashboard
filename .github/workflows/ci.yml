# CI entry point: PRs, pushes to main, the weekly schedule and manual runs.
# The jobs live in ci-jobs.yml; the `ci-full.yml` caller handles the
# `ci: full` label. Design: docs/0027-ci-workflows.md (D7, D9, D13).
#
# The caller job is named `CI`, so the one required check is
# `CI / CI result` (ci-jobs.yml). Path filtering happens inside the
# `changes` job, not in the triggers: a workflow skipped by `paths` would
# leave a required check pending.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # Pushes to main (docs/0027 D9): the merged code already passed the
  # PR run, so main re-runs only when an input of the rust-cache key or
  # the dependency audit changes — manifests, lockfile, deny.toml, the
  # workflows. Those runs re-warm the main-scoped caches every PR
  # restores from; code-only merges would re-save an identical cache.
  # An allowlist on purpose: it names what the run exists for. `changes`
  # treats every push as "everything".
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/ci-jobs.yml"
  # Weekly run (docs/0027 D8): RustSec advisories, runner images and
  # caches change without any commit. Runs every job, which also re-warms
  # the main-scoped caches after a quiet week (D10).
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

# One in-flight run per ref: superseded pushes cancel their queued run
# and free the runners sooner. Scheduled runs get their own group so they
# never cancel (or get cancelled by) a push to main. Concurrency lives in
# the callers only.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-jobs.yml
    permissions:
      contents: read
      pull-requests: read
