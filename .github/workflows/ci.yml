# CI — the AGENTS.md gates, enforced on every PR to main and every push
# to main. Design: docs/0027-ci-workflows.md (D1–D6).
#
# Environment: owner-provisioned self-hosted runners (labels below) —
# see docs/0027 §5 for the one-time apt provisioning list. Nix-free by
# owner decision (docs/0027 §4): toolchain from rustup, libs from apt.
# No secrets are used anywhere, so fork PRs are safe too.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One in-flight run per ref: superseded pushes cancel their queued run
# and free the shared runners sooner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned in lockstep with the dev shell's toolchain (flake.lock freezes
# rust-bin.stable.latest; 1.98.0 today). Bump both together, deliberately
# (docs/0027 D4).
env:
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  lint:
    # Formatting + the zero-warnings clippy gate (incl. the clippy.toml
    # token-discipline lints) + the bridge-less build variant.
    runs-on: [self-hosted, linux, amd64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap Rust toolchain
        run: |
          command -v rustup >/dev/null 2>&1 || \
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          # Workspace-external target cache (docs/0027 D2): survives
          # checkout's `git clean -ffdx`, warm across runs.
          echo "CARGO_TARGET_DIR=$HOME/.cache/my-dashboard/target" >> "$GITHUB_ENV"
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: cargo clippy --workspace --all-targets (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check -p my-dashboard --no-default-features (bridge-less)
        run: cargo check -p my-dashboard --no-default-features

  test:
    # Full test suite. Verified headless-green (docs/0027 §2), but Xvfb +
    # a fresh XDG_RUNTIME_DIR stay as cheap insurance so a future gpui rev
    # that wants a display fails loudly instead of mysteriously.
    runs-on: [self-hosted, linux, amd64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap Rust toolchain
        run: |
          command -v rustup >/dev/null 2>&1 || \
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          echo "CARGO_TARGET_DIR=$HOME/.cache/my-dashboard/target" >> "$GITHUB_ENV"
      - name: cargo test --workspace (Xvfb, fresh runtime dir)
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          xvfb-run --auto-servernum cargo test --workspace
