version: 2
updates:
  # Weekly version updates for the Cargo workspace (root Cargo.toml + Cargo.lock).
  # Note: Dependabot only updates crates.io registry dependencies — the git
  # dependencies (gpui, gpui-component, reqwest_client) are out of its scope
  # and are bumped manually by pinning a new rev in Cargo.toml.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
