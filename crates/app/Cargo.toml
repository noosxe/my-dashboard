[package]
name = "dashboard-app"
description = "Universal personal dashboard — application shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "dashboard"
path = "src/main.rs"

[dependencies]
log.workspace = true
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
reqwest_client.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
dashboard-core.workspace = true
dashboard-module-github.workspace = true
dashboard-debug = { workspace = true, optional = true }

[features]
# Agent Debug Bridge (docs/0010 D1): on by default so `cargo run` always
# serves; release packaging can drop it.
default = ["debug-tools"]
debug-tools = ["dep:dashboard-debug"]
