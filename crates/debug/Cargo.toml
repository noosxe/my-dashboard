[package]
name = "dashboard-debug"
description = "Agent Debug Bridge — in-process socket server + protocol (docs/0010)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
gpui.workspace = true
dashboard-core.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# Unbounded channel for socket-thread → main-thread job marshalling (D3);
# `unbounded_send` is callable from plain threads, the receiver is awaited
# on the foreground executor.
futures = "0.3"

# Ring writer for app.logs (D8): implements flexi_logger::LogWriter, tee-d
# off the primary file writer via log_to_file_and_writer.
flexi_logger.workspace = true

# SIGTERM/SIGKILL + signal-0 liveness probes for `session stop`
# (docs/0055 D5) — the CLI half only; the app never links this.
libc = "0.2"

# AT-SPI client for tree.dump enrichment + node click/focus (D4/D7).
# Proxies only — the bus connection is plain zbus, mirroring how
# accesskit_unix connects. Versions unify with the lockfile via the
# workspace.
atspi.workspace = true
zbus.workspace = true
