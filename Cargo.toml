[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/core",
    "crates/debug",
    "crates/modules/github",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
# GPUI stack at gpui-component v0.6.0 — the "GPUI Kit" rebrand. Upstream
# republished the zed gpui family to crates.io as gpui-pre-* (gpui-component
# no longer builds against zed-git gpui, so our direct deps moved with it;
# the package-rename aliases keep `use gpui::…` etc. unchanged), renamed the
# assets crate to gpui-kit-assets, and added a gpui-kit umbrella crate — we
# deliberately don't adopt it: explicit deps pin the same versions with zero
# import churn (see PR for #114).
#
# Exact pins (=), not caret (#126): each gpui-pre release is a snapshot of a
# DIFFERENT zed rev — "same-ish version" is not the same code, so a pin that
# can drift under us isn't a pin (docs/0007: verify against pinned upstream,
# never remembered details). The caret already bit at birth: #124's manifest
# said 0.3.1 and its own lockfile resolved 0.3.3, and 0.3.4 (zed@6916400) is
# published now — one lockfile regen away from a silent behavior change.
# Upstream pins its own family the same way (`=0.3.3` in gpui-pre-platform's
# Cargo.toml, verified in the vendored crate). Bumps are deliberate PRs:
# flip all three to the same new =x.y.z together, run the full gates, the
# #125 upstream-quirk re-verification checklist, and an app smoke.
gpui = { package = "gpui-pre", version = "=0.3.3" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.3", features = [
    "font-kit", "x11", "wayland",
] }
# Concrete gpui HttpClient — serves remote avatar images (docs/0005 §6.3,
# doc 0012 D1). Same gpui-pre family as gpui; exact-pinned with it.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.3" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "94a313a72a2513aee2780240cd322d552b2395f0" } # v0.6.0
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-component", rev = "94a313a72a2513aee2780240cd322d552b2395f0" } # v0.6.0
dashboard-core = { path = "crates/core" }
dashboard-debug = { path = "crates/debug" }
dashboard-module-github = { path = "crates/modules/github" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Markdown bodies (docs/0017 D1): CommonMark + GFM extensions parser; no
# default features (no HTML output path). Bare-URL autolinks come from
# linkify — the pairing zed's markdown crate uses.
pulldown-cmark = { version = "0.13", default-features = false }
# Diff-row syntax highlighting (docs/0040 D7): tokenizer only — no
# syntect themes, no Oniguruma C toolchain (fancy-regex backend). The
# default syntax pack loads from an embedded dump at first use.
syntect = { version = "5", default-features = false, features = [
    "parsing", "default-syntaxes", "dump-load", "regex-fancy",
] }
linkify = "0.11"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Debug bridge (docs/0010 D3): unbounded channel for socket-thread →
# main-thread job marshalling.
futures = "0.3"
atspi = { version = "0.30", default-features = false, features = ["proxies"] }
zbus = "5"
# Logging (docs/0008): emit through the `log` facade (gpui does too — its
# diagnostics flow through our subscriber); flexi_logger 0.31 backend:
# rotating file + stderr duplicate, RUST_LOG override.
log = "0.4"
flexi_logger = "0.31"
# GitHub module: sync HTTP on the background executor (rustls 0.23 shared with
# the zed tree) + OS keychain (zbus Secret Service on Linux, Security.framework
# on macOS — both stacks already in the lockfile).
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Keep debug info cheap in dev builds.
[profile.dev]
debug = "limited"

# Optimize hot-path crates even in dev builds — mirrors upstream gpui-component's
# own workspace tuning; makes dev builds render smoothly instead of stuttering.
# Specs use the real gpui-pre-* package names (`gpui` is a package rename).
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
taffy = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
resvg = { opt-level = 3 }
smol = { opt-level = 3 }
